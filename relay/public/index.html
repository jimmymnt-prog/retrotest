<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#0b1424">

  <title>Retro Pad — Manette téléphone</title>

  <link rel="stylesheet" href="/controller.css">
</head>

<body>
  <header>
    <div>
      <strong>RETRO <span>PAD</span></strong>

      <small id="game-name">
        Manette téléphone · Joueur 1
      </small>
    </div>

    <button id="fullscreen" type="button">
      Plein écran
    </button>
  </header>

  <form id="pair-form">
    <label for="code">Code du PC</label>

    <input
      id="code"
      inputmode="numeric"
      autocomplete="one-time-code"
      pattern="[0-9]{6}"
      maxlength="6"
      placeholder="123456"
      required
    >

    <button type="submit">Connecter</button>
  </form>

  <p id="status" role="status" aria-live="polite">
    Entrez le code affiché sur le PC.
  </p>

  <p id="rotate">
    ↻ Tournez votre téléphone en paysage.
  </p>

  <main id="pad">
    <section class="direction-zone" aria-label="Directions">
      <div id="dpad" aria-label="Croix directionnelle">
        <span class="up">▲</span>
        <span class="left">◀</span>
        <span class="middle">✚</span>
        <span class="right">▶</span>
        <span class="down">▼</span>
      </div>

      <label id="stick-option" hidden>
        <input type="checkbox" id="stick" checked>
        Stick N64
      </label>
    </section>

    <section
      id="center-buttons"
      aria-label="Commandes de partie"
    ></section>

    <section
      id="actions"
      aria-label="Boutons de jeu"
    ></section>
  </main>

  <footer>
    Le téléphone commande · Le jeu reste sur le grand écran
  </footer>

  <script src="/controller.js"></script>
</body>
</html>
